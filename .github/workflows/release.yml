# ClawPanel 发布构建工作流
# 推送 v* 标签时自动构建 macOS (Apple Silicon) 产物并创建 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'

jobs:
  # ── macOS (Apple Silicon) 构建 job ─────────────────────────────────────────
  build:
    name: 构建 (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置版本标签
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 同步版本号到构建产物
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          node scripts/sync-version.js "$VERSION"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.name }}

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 代码签名（可选）
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "ClawPanel ${{ env.TAG_NAME }}"
          releaseBody: "正在构建 macOS (Apple Silicon) 安装包，请稍候..."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform.args }}

      # ── 准备 preinstall 脚本（嵌入到 .pkg 中，安装前自动执行 pkg-preinstall.sh） ──
      - name: 准备 preinstall 脚本
        shell: bash
        run: |
          set -euo pipefail
          PKG_SCRIPTS_DIR="${GITHUB_WORKSPACE}/pkg-scripts"
          mkdir -p "$PKG_SCRIPTS_DIR"

          # pkgbuild 要求脚本名必须严格为 preinstall / postinstall（无扩展名）
          # 注意：使用 pkg-preinstall.sh（轻量版），避免 installer 进程锁冲突
          # 另将 install-openclaw.sh 一并放入，供 preinstall 调用（安装 OpenClaw CLI）
          cp scripts/pkg-preinstall.sh "$PKG_SCRIPTS_DIR/preinstall"
          chmod +x "$PKG_SCRIPTS_DIR/preinstall"
          cp scripts/install-openclaw.sh "$PKG_SCRIPTS_DIR/install-openclaw.sh"
          chmod +x "$PKG_SCRIPTS_DIR/install-openclaw.sh"

          # 写明脚本元信息，方便排查
          echo "已嵌入 preinstall + install-openclaw.sh："
          ls -la "$PKG_SCRIPTS_DIR"
          head -n 5 "$PKG_SCRIPTS_DIR/preinstall"

          echo "PKG_SCRIPTS_DIR=$PKG_SCRIPTS_DIR" >> "$GITHUB_ENV"

      # ── 通过 pkgbuild 把 Tauri 构建的 .app 打成 .pkg 并嵌入 preinstall ──
      - name: 生成 .pkg 安装包（内嵌 preinstall）
        id: build_pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          TARGET_DIR="src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle/macos"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "❌ 未找到 macOS 构建产物目录: $TARGET_DIR" >&2
            find src-tauri/target -name '*.app' -maxdepth 6 -print || true
            exit 1
          fi

          # Tauri 产物 .app 名称来自 tauri.conf.json 的 productName（OpenClaw.app）
          APP_PATH="$(find "$TARGET_DIR" -maxdepth 1 -name '*.app' -type d | head -n1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ 未找到 .app 产物" >&2
            ls -la "$TARGET_DIR" || true
            exit 1
          fi
          echo "✅ 找到 .app: $APP_PATH"

          APP_NAME="$(basename "$APP_PATH" .app)"
          PKG_FILE="ClawPanel_${VERSION}_aarch64.pkg"

          # 使用 pkgbuild 打包，--scripts 指向 preinstall 目录
          pkgbuild \
            --component "$APP_PATH" \
            --install-location "/Applications" \
            --scripts "$PKG_SCRIPTS_DIR" \
            --identifier "ai.openclaw.clawpanel.pkg" \
            --version "$VERSION" \
            "$PKG_FILE"

          echo "✅ pkg 构建完成: $PKG_FILE"
          ls -la "$PKG_FILE"

          # 校验 preinstall 是否真的嵌入（通过 pkgutil 展开检查）
          EXPAND_DIR="$(mktemp -d)"
          pkgutil --expand "$PKG_FILE" "$EXPAND_DIR/expanded"
          if [ -f "$EXPAND_DIR/expanded/Scripts/preinstall" ] && \
             [ -f "$EXPAND_DIR/expanded/Scripts/install-openclaw.sh" ]; then
            echo "✅ preinstall + install-openclaw.sh 均已成功嵌入 .pkg"
          elif [ -f "$EXPAND_DIR/expanded/Scripts/preinstall" ]; then
            echo "⚠️ 警告：install-openclaw.sh 未嵌入" >&2
            find "$EXPAND_DIR/expanded" -type f || true
          fi
          rm -rf "$EXPAND_DIR"

          echo "PKG_FILE=$PKG_FILE" >> "$GITHUB_ENV"
          echo "pkg_file=$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: 上传 .pkg 到 GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "$PKG_FILE" --clobber
          echo "✅ 已上传到 Release: $PKG_FILE"

  # ── 构建完成后更新 Release Notes ───────────────────────────────────────────
  update-release-notes:
    name: 更新 Release Notes
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'
    permissions:
      contents: write

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置版本标签
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 构建前端并上传热更新包
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG_NAME#v}"

          # 构建前端
          npm ci
          npm run build

          # 打包 dist 目录为 zip
          cd dist
          zip -r "../web-${VERSION}.zip" .
          cd ..

          # 计算 SHA-256
          HASH=$(sha256sum "web-${VERSION}.zip" | cut -d' ' -f1)
          SIZE=$(stat -c%s "web-${VERSION}.zip" 2>/dev/null || stat -f%z "web-${VERSION}.zip")

          # 上传为 Release Asset
          gh release upload "$TAG_NAME" "web-${VERSION}.zip" --clobber

          # 读取现有 minAppVersion（前端热更新通常不需要更新 Rust 后端，保留旧值）
          MIN_APP_VER=$(cat docs/update/latest.json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('minAppVersion','0.9.0'))" 2>/dev/null || echo "0.9.0")

          # 更新 docs/update/latest.json
          DL_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/web-${VERSION}.zip"
          cat > docs/update/latest.json << EOF
          {
            "version": "${VERSION}",
            "minAppVersion": "${MIN_APP_VER}",
            "hash": "sha256:${HASH}",
            "url": "${DL_URL}",
            "size": ${SIZE},
            "changelog": "",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          # 去掉 heredoc 缩进
          sed -i 's/^          //' docs/update/latest.json

          # 提交 latest.json 到 main 分支
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/update/latest.json
          git commit -m "ci: update latest.json for ${TAG_NAME}" || true
          git push origin HEAD:main || true

      - name: 生成并更新 Release Notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG_NAME#v}"
          DL="https://github.com/${REPO}/releases/download/${TAG_NAME}"

          # ── 生成分类 Changelog ──
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p' || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            CHANGELOG_HEADER="自 ${PREV_TAG} 以来的变更"
          else
            RANGE=""
            CHANGELOG_HEADER="主要变更"
          fi

          # 按 conventional commit 前缀分类
          get_logs() {
            local prefix="$1"
            if [ -n "$RANGE" ]; then
              git log "$RANGE" --pretty=format:"%s" --no-merges | { grep -iE "^${prefix}" || true; } | sed "s/^${prefix}[:(] */- /" | head -20
            else
              git log --pretty=format:"%s" --no-merges -30 | { grep -iE "^${prefix}" || true; } | sed "s/^${prefix}[:(] */- /" | head -20
            fi
          }

          FEATS=$(get_logs "feat")
          FIXES=$(get_logs "fix")
          OTHERS=$(
            if [ -n "$RANGE" ]; then
              git log "$RANGE" --pretty=format:"%s" --no-merges | { grep -ivE "^(feat|fix|style|chore|ci|docs|test|build)" || true; } | sed 's/^/- /' | head -10
            else
              git log --pretty=format:"%s" --no-merges -30 | { grep -ivE "^(feat|fix|style|chore|ci|docs|test|build)" || true; } | sed 's/^/- /' | head -10
            fi
          )

          CHANGELOG_BODY=""
          if [ -n "$FEATS" ]; then
            CHANGELOG_BODY="${CHANGELOG_BODY}"$'\n### ✨ 新功能\n'"${FEATS}"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG_BODY="${CHANGELOG_BODY}"$'\n### 🐛 修复\n'"${FIXES}"$'\n'
          fi
          if [ -n "$OTHERS" ]; then
            CHANGELOG_BODY="${CHANGELOG_BODY}"$'\n### 📦 其他\n'"${OTHERS}"$'\n'
          fi
          if [ -z "$CHANGELOG_BODY" ]; then
            CHANGELOG_BODY=$'\n- 常规更新与优化\n'
          fi

          # ── 构建状态 ──
          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS_BADGE="✅ macOS (Apple Silicon) 构建成功"
          else
            STATUS_BADGE="⚠️ 构建失败，请查看 [Actions 日志](https://github.com/${REPO}/actions)"
          fi

          # ── 写入 Release Notes ──
          {
            echo "${STATUS_BADGE}"
            echo ""
            echo "## 📥 下载安装"
            echo ""
            echo "### macOS"
            echo "| 芯片 | 格式 | 安装包 |"
            echo "|------|------|--------|"
            echo "| Apple Silicon (M1/M2/M3/M4) | .pkg（推荐，自动安装 OpenClaw） | [ClawPanel_${VERSION}_aarch64.pkg](${DL}/ClawPanel_${VERSION}_aarch64.pkg) |"
            echo "| Apple Silicon (M1/M2/M3/M4) | .dmg | [ClawPanel_${VERSION}_aarch64.dmg](${DL}/ClawPanel_${VERSION}_aarch64.dmg) |"
            echo ""
            echo '> **💡 .pkg 与 .dmg 的区别**：`.pkg` 会在安装前自动执行 `install-openclaw.sh`（嵌入的 preinstall 脚本），通过国内镜像源一键安装 OpenClaw CLI 与 Gateway 服务；`.dmg` 仅拷贝 App，需首次启动后手动安装 OpenClaw。'
            echo ""
            echo '> **⚠️ 首次打开提示“无法验证开发者”？** 在终端执行：`sudo xattr -rd com.apple.quarantine /Applications/ClawPanel.app`，或前往 **系统设置 → 隐私与安全性** 点击「仍要打开」。'
            echo ""
            echo "---"
            echo ""
            echo "## 🚀 首次使用"
            echo ""
            echo "1. 安装并打开 ClawPanel"
            echo "2. 首次运行会自动检测 Node.js 环境和 OpenClaw CLI"
            echo "3. 如未安装 OpenClaw，按提示一键安装即可"
            echo "4. 安装完成后自动跳转仪表盘，开始使用"
            echo ""
            echo '> **系统要求**：macOS 11+ (Apple Silicon)，Node.js 18+（推荐 22 LTS）'
            echo ""
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADER}"
            echo "${CHANGELOG_BODY}"
            echo "---"
            echo ""
            echo "📖 [项目主页](https://github.com/${REPO}) · 💬 [反馈问题](https://github.com/${REPO}/issues) · 📣 [QQ 群](https://qt.cool/c/OpenClaw)"
          } > release_body.md

          gh release edit "$TAG_NAME" --notes-file release_body.md